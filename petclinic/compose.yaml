services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  petclinic:
    build: .
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      POSTGRES_URL: jdbc:postgresql://postgres/petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASS: petclinic
      OTEL_SERVICE_NAME: petclinic
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=petclinic-agent,deployment.environment.name=${ENVIRONMENT:-local}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://localhost:4318}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [petclinic]
    ports:
      - "${HTTP_PORT:-8088}:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      PETCLINIC_API_KEY: ${PETCLINIC_API_KEY:?set PETCLINIC_API_KEY}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
