services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASSWORD: petclinic
    # JSON logs in $PGDATA/log, with every statement slower than 100 ms.
    command:
      - postgres
      - -c
      - logging_collector=on
      - -c
      - log_destination=jsonlog
      - -c
      - log_file_mode=0644
      - -c
      - log_min_duration_statement=100
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U petclinic"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  petclinic:
    build: .
    platform: linux/amd64
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres,spring-data-jpa
      POSTGRES_URL: jdbc:postgresql://postgres/petclinic
      POSTGRES_USER: petclinic
      POSTGRES_PASS: petclinic
      OTEL_SERVICE_NAME: petclinic
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=petclinic-agent,deployment.environment.name=${ENVIRONMENT:-local}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      # Stable database conventions (db.system.name, db.namespace, db.query.text, ...);
      # HTTP conventions are already stable by default in Java agent 2.x.
      OTEL_SEMCONV_STABILITY_OPT_IN: database
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    depends_on: [petclinic]
    ports:
      - "${HTTP_PORT:-8088}:8080"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:8080}
      PETCLINIC_API_KEY: ${PETCLINIC_API_KEY:?set PETCLINIC_API_KEY}
      OTEL_SERVICE_NAME: caddy
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=petclinic-agent,deployment.environment.name=${ENVIRONMENT:-local}
      OTEL_EXPORTER_OTLP_PROTOCOL: grpc
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
      OTEL_EXPORTER_OTLP_INSECURE: "true"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_logs:/var/log/caddy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.163.1
    command: ["--config=/etc/otelcol/config.yaml"]
    # Root, to read the host's /proc and Postgres's log directory (mode 0700).
    user: "0"
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:?set OTEL_EXPORTER_OTLP_ENDPOINT}
      OTLP_HEADERS: ${OTLP_HEADERS:-{}}
      ENVIRONMENT: ${ENVIRONMENT:-local}
    volumes:
      - ./otel-collector.yaml:/etc/otelcol/config.yaml:ro
      - /:/hostfs:ro
      - caddy_logs:/var/log/caddy:ro
      - pgdata:/pgdata:ro
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_logs:
