# PetClinic on Supabase Postgres instead of the local container.
#   docker compose -f compose.yaml -f compose.public.yaml -f compose.supabase.yaml up -d
#
# PetClinic connects through Supabase's pooler in session mode (port 5432): it is a
# long-running server, and its JDBC driver uses prepared statements. The direct
# database host is IPv6-only unless you buy the IPv4 add-on.
#
# Set in .env:
#   POSTGRES_URL=jdbc:postgresql://aws-0-<region>.pooler.supabase.com:5432/postgres
#   POSTGRES_USER=<role>.<project-ref>     POSTGRES_PASS=...
#   SUPABASE_PROJECT_REF=<project-ref>     SUPABASE_REGION=<region, e.g. eu-west-1>
#   SUPABASE_METRICS_KEY=sb_secret_...    (a secret API key just for the scrape)
# Create the role with its own schema first (see the README), so PetClinic's tables
# stay out of the public schema that Supabase's Data API exposes.
services:
  postgres:
    # Not started; kept in compose.yaml for local runs.
    profiles: [local-db]

  petclinic:
    depends_on: !reset {}
    environment:
      POSTGRES_URL: ${POSTGRES_URL:?set POSTGRES_URL}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASS: ${POSTGRES_PASS:?set POSTGRES_PASS}

  otel-collector:
    command: ["--config=/etc/otelcol/config.yaml", "--config=/etc/otelcol/supabase.yaml"]
    environment:
      SUPABASE_PROJECT_REF: ${SUPABASE_PROJECT_REF:?set SUPABASE_PROJECT_REF}
      SUPABASE_REGION: ${SUPABASE_REGION:?set SUPABASE_REGION}
      SUPABASE_METRICS_KEY: ${SUPABASE_METRICS_KEY:?set SUPABASE_METRICS_KEY}
    volumes:
      - ./otel-collector.supabase.yaml:/etc/otelcol/supabase.yaml:ro
