# On AWS: Caddy serves the public hostname with automatic HTTPS, a synthetic browser
# visits the chat page every minute (Web Analytics), and a drain sink receives a
# test log drain for the delivery-failure test.
services:
  caddy:
    environment:
      SINK_KEY: ${SINK_KEY:-}
    ports:
      - "80:80"
      - "443:443"

  browser:
    build: ./browser
    platform: linux/amd64
    environment:
      TARGET_URL: ${TARGET_URL:-https://petclinic-agent.vercel.app/}
    shm_size: 512m
    mem_limit: 768m
    # Exits on its own after STOP_AT; don't restart it then.
    restart: on-failure

  drain-sink:
    build: ./drain-sink
    environment:
      SINK_KEY: ${SINK_KEY:-}
    volumes:
      - drain_sink:/data
    restart: unless-stopped

volumes:
  drain_sink:
