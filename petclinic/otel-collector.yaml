# OpenTelemetry Collector next to PetClinic: the stack's single exit to the OTLP backend.
#   in:  OTLP from PetClinic (Java agent) and Caddy, Caddy access logs,
#        Postgres logs (slow queries), host metrics
#   out: OTEL_EXPORTER_OTLP_ENDPOINT with OTLP_HEADERS (a YAML map, e.g. {authorization: "Bearer abc"})
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }
  host_metrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
  file_log/caddy:
    include: [/var/log/caddy/access.log]
    start_at: end
    resource: { service.name: caddy }
    operators:
      - type: json_parser
        timestamp: { parse_from: attributes.ts, layout_type: epoch, layout: s.ns }
        severity: { parse_from: attributes.level }
        # Caddy writes the request's trace context; make it the record's own.
        trace:
          trace_id: { parse_from: attributes.traceID }
          span_id: { parse_from: attributes.spanID }
  file_log/postgres:
    include: [/pgdata/log/*.json]
    start_at: end
    resource: { service.name: postgres, db.system.name: postgresql }
    operators:
      - type: json_parser
        timestamp: { parse_from: attributes.timestamp, layout: "%Y-%m-%d %H:%M:%S.%L %Z" }
        severity: { parse_from: attributes.error_severity }
      # Slow-statement lines: "duration: 205.7 ms  statement: select ..."
      - type: regex_parser
        parse_from: attributes.message
        parse_to: attributes.slow
        regex: '^duration: (?P<duration_ms>[0-9.]+) ms\s+(?:statement|execute [^:]*): (?P<query>[\s\S]*)$'
        on_error: send_quiet

processors:
  # Map the raw Caddy and Postgres log fields to OpenTelemetry semantic conventions.
  transform/logs:
    error_mode: ignore
    log_statements:
      - context: log
        conditions:
          - resource.attributes["service.name"] == "caddy"
        statements:
          - set(body, attributes["msg"])
          - set(attributes["http.request.method"], attributes["request"]["method"])
          - set(attributes["url.path"], attributes["request"]["uri"])
          - replace_pattern(attributes["url.path"], "\\?.*$", "")
          - set(attributes["server.address"], attributes["request"]["host"])
          - set(attributes["server.port"], Int(ExtractPatterns(attributes["server.address"], ":(?P<port>[0-9]+)$")["port"])) where IsMatch(attributes["server.address"], ":[0-9]+$")
          - replace_pattern(attributes["server.address"], ":[0-9]+$", "")
          - set(attributes["client.address"], attributes["request"]["client_ip"])
          - set(attributes["network.protocol.version"], attributes["request"]["proto"])
          - replace_pattern(attributes["network.protocol.version"], "^HTTP/", "")
          - set(attributes["user_agent.original"], attributes["request"]["headers"]["User-Agent"][0])
          - set(attributes["http.response.status_code"], Int(attributes["status"]))
          - set(attributes["http.response.body.size"], Int(attributes["size"]))
          - set(attributes["caddy.duration_s"], attributes["duration"])
          - delete_matching_keys(attributes, "^(request|resp_headers|msg|status|size|duration|traceID|spanID|ts|level|logger|user_id|bytes_read)$")
      - context: log
        conditions:
          - resource.attributes["service.name"] == "postgres"
        statements:
          - set(body, attributes["message"])
          - set(attributes["db.namespace"], attributes["dbname"])
          - set(attributes["db.query.text"], attributes["slow"]["query"]) where attributes["slow"] != nil
          - set(attributes["postgresql.statement.duration_ms"], Double(attributes["slow"]["duration_ms"])) where attributes["slow"] != nil
          - delete_key(attributes, "slow")
          - delete_key(attributes, "message")
  # Where the stack runs (cloud.provider, cloud.region, cloud.availability_zone, host.id, …), read from the
  # instance metadata service. Containers reach IMDSv2 only with a hop limit of 2; deploy-lightsail.sh sets it.
  # Off AWS the ec2 detector finds nothing and the stack runs as before.
  resourcedetection:
    detectors: [env, ec2]
    timeout: 2s
    override: false
    ec2:
      resource_attributes:
        # On Lightsail this is Lightsail's own AWS account, not yours.
        cloud.account.id: { enabled: false }
  resource:
    attributes:
      - { key: service.namespace, value: petclinic-agent, action: upsert }
      - { key: deployment.environment.name, value: "${env:ENVIRONMENT:-local}", action: upsert }
  batch: {}

exporters:
  otlp_http:
    endpoint: ${env:OTEL_EXPORTER_OTLP_ENDPOINT}
    headers: ${env:OTLP_HEADERS}

service:
  pipelines:
    traces: { receivers: [otlp], processors: [resourcedetection, resource, batch], exporters: [otlp_http] }
    metrics: { receivers: [otlp, host_metrics], processors: [resourcedetection, resource, batch], exporters: [otlp_http] }
    logs: { receivers: [otlp, file_log/caddy, file_log/postgres], processors: [transform/logs, resourcedetection, resource, batch], exporters: [otlp_http] }
